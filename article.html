.nav-wordmark{font-family:var(--font-display);font-size:15px;font-weight:700;}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-back{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);padding:6px 14px;border:1px solid var(--border);border-radius:3px;transition:all .2s;}

.art-h1{font-family:var(--font-display);font-size:42px;font-weight:900;line-height:1.12;margin-bottom:16px;letter-spacing:-0.5px;}

.proof-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;}
.proof-card.high::before{background:var(--green);}
.proof-card.mid::before{background:var(--amber);}
.proof-card.low::before{background:var(--red);}
.proof-main{flex-shrink:0;text-align:center;}
.proof-score-big{font-family:var(--font-mono);font-size:42px;font-weight:500;line-height:1;}
.proof-label{font-family:var(--font-mono);font-size:8px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.proof-details{flex:1;}
.proof-verdict{font-family:var(--font-mono);font-size:11px;margin-bottom:10px;font-weight:500;}
.proof-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.proof-bar-item{}
.proof-bar-label{font-family:var(--font-mono);font-size:8px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;display:flex;justify-content:space-between;}

.proof-bar-fill{height:100%;border-radius:2px;transition:width 1s ease;}
.proof-sources{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);margin-top:10px;}

.art-content strong{color:var(--text);font-weight:500;}
.art-content em{color:var(--amber-light);font-style:italic;}

.dc-value{font-family:var(--font-mono);font-size:28px;font-weight:500;color:var(--amber-light);margin-bottom:4px;}
.dc-context{font-size:14px;color:var(--text-dim);line-height:1.5;}
.dc-source{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);margin-top:8px;}

.signal-box-title{font-family:var(--font-mono);font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}

.signal-text{font-size:15px;color:var(--text-dim);line-height:1.7;font-style:italic;}

.nl-input{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:10px 16px;font-family:var(--font-mono);font-size:11px;color:var(--text);outline:none;width:240px;transition:border .2s;}

/* FOOTER */

.footer-copy{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);}
.footer-link{font-family:var(--font-mono);font-size:10px;color:var(--amber);}

/* TOAST */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--card);border:1px solid var(--amber);border-radius:6px;padding:14px 28px;font-family:var(--font-mono);font-size:12px;color:var(--amber-light);z-index:10000;transition:transform .4s cubic-bezier(0.4,0,0.2,1);pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

@keyframes fade-up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fade-up .5s cubic-bezier(0.4,0,0.2,1) both;}

@media(max-width:900px){

  .art-content p{font-size:16px;}

  .share-bar{margin-left:0;}
  .art-nl-form{flex-direction:column;align-items:center;}
  .nl-input{width:100%;}
}
</style>

const articles=[
  {id:'ai-infrastructure-bet',cat:'ai',catLabel:'AI / ML',catColor:'var(--red)',headline:"The $40B AI Infrastructure Bet Nobody Is Talking About",subtitle:"While everyone watches the model wars, the real AI play is happening in the plumbing.",proof:92,dd:94,xr:88,rw:91,time:'4 hours ago',read:'6 min',date:'Mar 25, 2026',dataPoints:14,crossRefs:5,
   sources:[{text:'Azure GPU capacity reservation data — Q1 2026 allocation reports',type:'primary'},{text:'NVIDIA distribution and shipment filings — SEC quarterly reports',type:'primary'},{text:'Cloud procurement contract analysis — enterprise software database',type:'analysis'},{text:'Fortune 50 financial services firm infrastructure filings',type:'primary'},{text:'Comparable cloud infrastructure cost modeling',type:'analysis'}],
   content:`<p>Microsoft's Azure GPU reservations hit an all-time high last week. That alone isn't surprising — demand has been climbing for 18 months straight, and every earnings call from Satya Nadella includes the phrase "unprecedented demand" at least twice. What's surprising is the <em>pattern.</em></p>
<p>A single enterprise customer appears to have reserved roughly 40% of all new GPU capacity added in Q1 2026. Not 10%. Not 20%. <strong>Forty percent.</strong> That's not a customer running a few experiments with copilots. That's someone building a foundation model — in-house, behind closed doors, at a scale that rivals what OpenAI was doing 18 months ago.</p>

<div class="data-callout"><div class="dc-label">Key Data Point</div><div class="dc-value">40%</div><div class="dc-context">Share of new Azure GPU capacity reserved by a single enterprise customer in Q1 2026 — the largest single-customer allocation in Azure's history.</div><div class="dc-source">Source: Azure capacity API data, cross-referenced with NVIDIA distribution filings</div></div>

<p>We cross-referenced Azure capacity data with cloud procurement filings and NVIDIA's distribution schedules. The math eliminates most obvious candidates. It's not Microsoft itself (they use separate internal allocations). It's not OpenAI (they have dedicated Azure capacity under a different contract structure). It's not a hyperscaler — Google and Amazon build their own.</p>

<h2>The Financial Services Signal</h2>

<p>The evidence points to a Fortune 50 financial services firm building an internal foundation model for risk assessment and trade execution. Three data points converge:</p>

<p><strong>First,</strong> the GPU reservation pattern matches internal model training, not inference. The allocation is front-loaded — massive compute blocks reserved for 8-week periods with option to extend. That's a training cadence, not a deployment pattern.</p>

<p><strong>Second,</strong> enterprise software contract filings show a major financial services firm signed a $200M+ multi-year Azure commitment in late Q4 2025 — one of the largest non-tech enterprise cloud deals ever recorded. The timing aligns perfectly with the capacity reservations.</p>

<div class="signal-box"><div class="signal-box-title"><div class="signal-dot"></div> Disruptor Radar Signal</div><div class="signal-text">This pattern was flagged by our Disruptor Radar 14 days before this article published. The signal type: "Compute Infrastructure Anomaly" in the Financial Services sector. Proof Score at detection: 78. Current score with additional evidence: 92.</div></div>

<p><strong>Third,</strong> and this is the piece that locks it in — hiring data. A Fortune 50 financial services firm (which we're choosing not to name until we have filing confirmation) has hired 34 machine learning engineers from Google DeepMind, Meta FAIR, and Anthropic in the last 90 days. That's not an "AI strategy" hire. That's a foundation model team.</p>

<h2>What This Means</h2>

<p>If a major bank is building its own foundation model, the implications cascade through the entire AI value chain. First, it validates the thesis that <em>inference economics will matter more than model capabilities</em> within 18 months. A bank doesn't build its own model because GPT-5 isn't good enough — they build it because they can't send proprietary trading data to someone else's API.</p>

<div class="pull-quote"><p>A bank doesn't build its own model because GPT-5 isn't good enough. They build it because they can't send proprietary trading data to someone else's API.</p><cite>Bourbon Pour Analysis</cite></div>

<p>Second, it means GPU demand isn't peaking — it's <strong>bifurcating.</strong> We're entering a world where the AI compute market splits between model providers (OpenAI, Anthropic, Google) and enterprise builders who need sovereign compute. CoreWeave's IPO timing suddenly makes even more sense.</p>

<p>Third, watch the talent pipeline. If one bank is building, others are watching. Goldman, JPMorgan, and Citadel all have the balance sheet to follow. The AI talent war is about to get a new front — and compensation in AI just got a new ceiling.</p>

<h2>The Bottom Line</h2>

<p>The biggest AI infrastructure bet of 2026 isn't happening in Silicon Valley. It's happening on a trading floor. And by the time it becomes public, the market will have already moved.</p>

<p>We'll be tracking this signal through the Disruptor Radar. Set your alerts for Financial Services sector, compute infrastructure anomaly type, at 80+ Proof Score threshold. When the announcement comes — and it will — you'll know 30 days before everyone else.</p>`},

  {id:'fed-silence',cat:'markets',catLabel:'Markets',catColor:'var(--amber)',headline:"The Fed's Silence Is Louder Than Its Last Three Rate Decisions Combined",subtitle:"Powell hasn't spoken in 23 days. Every time this has happened, markets weren't ready for what came next.",proof:94,dd:96,xr:90,rw:93,time:'6 hours ago',read:'8 min',date:'Mar 25, 2026',dataPoints:18,crossRefs:6,
   sources:[{text:'Federal Reserve communication records — historical analysis 1994–2026',type:'primary'},{text:'FOMC meeting transcripts and minutes',type:'primary'},{text:'Bond market positioning data — CFTC weekly reports',type:'primary'},{text:'Fed funds futures curves — CME FedWatch',type:'primary'},{text:'Historical silence-to-policy-shift correlation analysis',type:'analysis'},{text:'Treasury market microstructure data',type:'analysis'}],
   content:`<p>Jerome Powell has not made a public statement in 23 days. No press conferences, no Congressional testimony, no off-the-record briefings, no carefully worded speeches at economic conferences. Twenty-three days of silence from the most powerful central banker on Earth.</p>
<p>That's the longest silence from a sitting Fed Chair since Ben Bernanke's 19-day stretch in May 2013 — which preceded the Taper Tantrum, a bond market sell-off that wiped out <strong>$1.4 trillion</strong> in global bond value in 8 weeks.</p>

<div class="data-callout"><div class="dc-label">Historical Pattern</div><div class="dc-value">8 of 9</div><div class="dc-context">Times a Fed Chair silence of 14+ days preceded a policy shift that surprised markets (since 1994). The only exception: Yellen's 16-day stretch in 2015, which preceded a widely telegraphed rate hike.</div><div class="dc-source">Source: Federal Reserve communication records, FOMC historical analysis</div></div>

<p>We analyzed every Fed Chair silence longer than 14 days since 1994. There have been 9 instances. In <strong>8 of those 9 cases,</strong> the silence preceded a policy shift that caught markets off guard. The one exception was Yellen's 16-day silence in late 2015, which preceded the most telegraphed rate hike in modern history — and even then, the <em>pace</em> of subsequent hikes surprised the market.</p>

<h2>What the Bond Market Already Knows</h2>

<p>Here's the part nobody is writing about: the bond market is already pricing something in. Fed funds futures have shifted 12 basis points in the last 10 trading days despite no new economic data, no Fed communication, and no meaningful change in inflation expectations. That's the bond market moving on the <em>absence</em> of information — treating the silence itself as a signal.</p>

<p>CFTC positioning data shows net short positions in 10-year Treasury futures at 18-month highs. The smart money isn't waiting for Powell to speak. They're positioning for what they think he'll say when he finally does.</p>

<div class="pull-quote"><p>The bond market is moving on the absence of information — treating the silence itself as a signal.</p><cite>Bourbon Pour Analysis</cite></div>

<p>Set your alerts. The silence won't last forever — and when it breaks, it will break fast.</p>`}

    </div>
    <div class="proof-details">
      <div class="proof-verdict" style="color:${proofColor}">${verdict}</div>
      <div class="proof-bars">
        <div class="proof-bar-item"><div class="proof-bar-label"><span>Data Density</span><span style="color:var(--green)">${article.dd}</span></div><div class="proof-bar-track"><div class="proof-bar-fill" style="width:${article.dd}%;background:var(--green)"></div></div></div>
        <div class="proof-bar-item"><div class="proof-bar-label"><span>Cross-References</span><span style="color:var(--blue)">${article.xr}</span></div><div class="proof-bar-track"><div class="proof-bar-fill" style="width:${article.xr}%;background:var(--blue)"></div></div></div>
        <div class="proof-bar-item"><div class="proof-bar-label"><span>Recency</span><span style="color:var(--amber)">${article.rw}</span></div><div class="proof-bar-track"><div class="proof-bar-fill" style="width:${article.rw}%;background:var(--amber)"></div></div></div>
      </div>
      <div class="proof-sources">${article.sources.length} sources cited · <a href="proof-score.html">How Proof Score works →</a></div>
    </div>
    <div class="share-bar">
      <button class="share-btn" onclick="showToast('Link copied 🥃')">Share ↗</button>
      <button class="share-btn" onclick="showToast('Saved to reading list')">Save ✦</button>
    </div>
  </div>

  <!-- BODY -->
  <article class="art-content fade-in" style="animation-delay:.15s" id="articleBody">
    ${article.content}
  </article>

  <!-- SOURCES -->
  <div class="sources-block fade-in" style="animation-delay:.2s">
    <div class="sources-title">Sources & Evidence (${article.sources.length})</div>
    ${article.sources.map((s,i)=>`<div class="source-item"><span class="source-num">${String(i+1).padStart(2,'0')}</span><span class="source-text">${s.text}<span class="source-type ${s.type}">${s.type}</span></span></div>`).join('')}
  </div>

  <!-- RELATED -->
  <div class="related fade-in" style="animation-delay:.25s">
    <div class="related-title">Continue Reading</div>
    <div class="related-grid">
      ${articles.filter(a=>a.id!==articleId).slice(0,3).map(a=>{
        const c=a.proof>=85?'var(--green)':a.proof>=65?'var(--amber)':'var(--text-dim)';
        return `<div class="rel-card" onclick="window.location.href='article.html?id=${a.id}'"><div class="rel-cat" style="color:${a.catColor}">${a.catLabel}</div><div class="rel-headline">${a.headline}</div><div class="rel-meta"><span style="color:${c}">${a.proof}-proof</span> · ${a.read}</div></div>`;
      }).join('')}
    </div>
  </div>

  <!-- NEWSLETTER CTA -->
  <div class="art-nl">
    <h3>Intelligence like this. <em>Every morning.</em></h3>
    <p>The Daily Sip delivers evidence-scored intelligence to 47,000+ professionals at 6:30 AM ET. Free forever.</p>
    <div class="art-nl-form">
      <input type="email" class="nl-input" id="nlEmail" placeholder="your@email.com">
      <button class="btn-primary" style="padding:10px 20px;" id="nlSubmit">Pour Me In</button>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-copy">© 2026 Bourbon Pour Media Inc.</div>
    <a href="articles.html" class="footer-link">← Back to Intelligence Desk</a>
  </footer>
`;

// ===== PROGRESS BAR =====
window.addEventListener('scroll',()=>{
  const body=document.getElementById('articleBody');
  if(!body)return;
  const rect=body.getBoundingClientRect();
  const total=body.scrollHeight;
  const scrolled=Math.max(0,-rect.top);
  const pct=Math.min(100,Math.max(0,(scrolled/total)*100));
  document.getElementById('progressFill').style.width=pct+'%';
});

// ===== NEWSLETTER =====
document.getElementById('nlSubmit')?.addEventListener('click',()=>{
  const email=document.getElementById('nlEmail').value.trim();
  if(!email||!email.includes('@')){showToast('Enter a valid email');return;}
  document.getElementById('nlEmail').value='';
  showToast("You're in. First Sip drops tomorrow at 6:30 AM ET 🥃");
});

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>{t.classList.remove('show');},2800);}
</script>
</body>
</html>
