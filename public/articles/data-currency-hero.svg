<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1208"/>
      <stop offset="100%" stop-color="#0A0805"/>
    </radialGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C47A2A" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#C47A2A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C47A2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A94B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C47A2A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0A0805" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0A0805" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur10">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur18">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-glow)"/>

  <!-- Subtle grid -->
  <g stroke="#C47A2A" stroke-width="0.5" opacity="0.045">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <!-- Central ambient glow -->
  <ellipse cx="600" cy="200" rx="480" ry="220" fill="url(#center-glow)"/>

  <!-- Connection lines -->
  <g stroke="#C47A2A" stroke-width="1" fill="none">
    <!-- From center -->
    <line x1="600" y1="200" x2="390" y2="110" opacity="0.22"/>
    <line x1="600" y1="200" x2="760" y2="130" opacity="0.28"/>
    <line x1="600" y1="200" x2="870" y2="265" opacity="0.18"/>
    <line x1="600" y1="200" x2="430" y2="295" opacity="0.22"/>
    <line x1="600" y1="200" x2="330" y2="195" opacity="0.16"/>
    <line x1="600" y1="200" x2="940" y2="175" opacity="0.14"/>
    <line x1="600" y1="200" x2="690" y2="330" opacity="0.20"/>
    <line x1="600" y1="200" x2="180" y2="260" opacity="0.10"/>
    <line x1="600" y1="200" x2="1050" y2="310" opacity="0.10"/>
    <!-- Secondary connections -->
    <line x1="390" y1="110" x2="260" y2="70" opacity="0.14"/>
    <line x1="390" y1="110" x2="330" y2="195" opacity="0.12"/>
    <line x1="760" y1="130" x2="930" y2="85" opacity="0.14"/>
    <line x1="760" y1="130" x2="870" y2="265" opacity="0.11"/>
    <line x1="870" y1="265" x2="1010" y2="315" opacity="0.14"/>
    <line x1="430" y1="295" x2="340" y2="350" opacity="0.11"/>
    <line x1="430" y1="295" x2="690" y2="330" opacity="0.10"/>
    <line x1="940" y1="175" x2="1070" y2="140" opacity="0.11"/>
    <line x1="260" y1="70" x2="160" y2="130" opacity="0.09"/>
    <line x1="330" y1="195" x2="180" y2="260" opacity="0.09"/>
    <line x1="1010" y1="315" x2="1100" y2="345" opacity="0.09"/>
  </g>

  <!-- Outer dim nodes -->
  <g fill="#120e06">
    <circle cx="160" cy="130" r="5" stroke="#C47A2A" stroke-width="0.8" stroke-opacity="0.25"/>
    <circle cx="180" cy="260" r="4" stroke="#C47A2A" stroke-width="0.8" stroke-opacity="0.2"/>
    <circle cx="260" cy="70" r="6" stroke="#C47A2A" stroke-width="0.8" stroke-opacity="0.28"/>
    <circle cx="340" cy="350" r="5" stroke="#C47A2A" stroke-width="0.8" stroke-opacity="0.2"/>
    <circle cx="930" cy="85" r="5" stroke="#C47A2A" stroke-width="0.8" stroke-opacity="0.25"/>
    <circle cx="1070" cy="140" r="4" stroke="#C47A2A" stroke-width="0.8" stroke-opacity="0.2"/>
    <circle cx="1010" cy="315" r="7" stroke="#C47A2A" stroke-width="0.8" stroke-opacity="0.28"/>
    <circle cx="1100" cy="345" r="4" stroke="#C47A2A" stroke-width="0.8" stroke-opacity="0.18"/>
  </g>

  <!-- Mid nodes -->
  <circle cx="330" cy="195" r="9" fill="#1a1208" stroke="#C47A2A" stroke-width="1.2" stroke-opacity="0.38"/>
  <circle cx="430" cy="295" r="11" fill="#1c1408" stroke="#C47A2A" stroke-width="1.4" stroke-opacity="0.42"/>
  <circle cx="690" cy="330" r="9" fill="#1a1208" stroke="#C47A2A" stroke-width="1.2" stroke-opacity="0.38"/>
  <circle cx="870" cy="265" r="13" fill="#201608" stroke="#C47A2A" stroke-width="1.5" stroke-opacity="0.48"/>
  <circle cx="940" cy="175" r="8" fill="#1a1208" stroke="#C47A2A" stroke-width="1.2" stroke-opacity="0.38"/>

  <!-- Hot node halos (glow behind) -->
  <circle cx="390" cy="110" r="34" fill="#C47A2A" fill-opacity="0.07" filter="url(#blur4)"/>
  <circle cx="760" cy="130" r="38" fill="#C47A2A" fill-opacity="0.09" filter="url(#blur4)"/>
  <!-- Center mega-glow -->
  <circle cx="600" cy="200" r="80" fill="#C47A2A" fill-opacity="0.10" filter="url(#blur18)"/>
  <circle cx="600" cy="200" r="48" fill="#C47A2A" fill-opacity="0.12" filter="url(#blur10)"/>

  <!-- Hot nodes -->
  <circle cx="390" cy="110" r="15" fill="#221508" stroke="#E8A94B" stroke-width="1.8"/>
  <circle cx="390" cy="110" r="8" fill="#C47A2A" fill-opacity="0.85"/>

  <circle cx="760" cy="130" r="17" fill="#241808" stroke="#E8A94B" stroke-width="2"/>
  <circle cx="760" cy="130" r="9" fill="#C47A2A" fill-opacity="0.88"/>

  <!-- Central hub -->
  <circle cx="600" cy="200" r="26" fill="#1e1408" stroke="#E8A94B" stroke-width="2.5"/>
  <circle cx="600" cy="200" r="15" fill="#C47A2A" fill-opacity="0.92"/>
  <circle cx="600" cy="200" r="6" fill="#F0C060" fill-opacity="0.96"/>
  <!-- Orbit ring -->
  <circle cx="600" cy="200" r="40" fill="none" stroke="#C47A2A" stroke-width="0.6" stroke-opacity="0.18" stroke-dasharray="4 9"/>

  <!-- Vignette -->
  <rect width="1200" height="400" fill="url(#vignette)"/>

  <!-- Subtle amber line at bottom -->
  <line x1="0" y1="399" x2="1200" y2="399" stroke="#C47A2A" stroke-width="1" opacity="0.3"/>
</svg>
